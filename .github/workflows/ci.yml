name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend, CLI & Shell Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: aegispt/pyproject.toml

      - name: Install backend and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./aegispt[dev]"

      - name: Lint Python with Ruff
        working-directory: aegispt
        run: ruff check backend cli

      - name: Run pytest suite
        working-directory: aegispt
        run: pytest -v

      - name: Lint shell scripts with ShellCheck
        run: shellcheck aegispt/aegispt aegispt/scripts/setup_ollama.sh

  frontend:
    name: Frontend Typecheck, Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aegispt/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: aegispt/frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck TypeScript
        run: pnpm typecheck

      - name: Lint frontend
        run: pnpm lint

      - name: Run frontend tests
        run: pnpm test

      - name: Build production bundle
        run: pnpm build

  security:
    name: Secret Scan & Lab Compose Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for leaked secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate Docker Compose lab configuration
        run: docker compose -f aegispt/lab/docker-compose.lab.yml config -q
