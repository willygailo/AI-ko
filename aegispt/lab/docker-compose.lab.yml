services:
  juice-shop:
    image: bkimminich/juice-shop:${JUICE_SHOP_TAG:-v17.3.0}
    ports:
      # Strictly bound to localhost only for private offline practice
      - "127.0.0.1:${JUICE_SHOP_PORT:-3000}:3000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 256
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: "no"
